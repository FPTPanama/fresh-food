[build]
  base = "apps/web"
  command = "rm -rf ../../node_modules ../../package-lock.json && npm install --legacy-peer-deps --install-links && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
